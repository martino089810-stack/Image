<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Prueba de Imagen y Audio</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="contenedor">

        <h1>🎁 Presiona el botón</h1>

        <!-- Imagen inicialmente oculta -->
        <img
            id="imagen"
            src="image1.png"
            alt="Imagen"
        >

        <!-- Botón -->
        <button id="btnMostrar">

            MOSTRAR

        </button>

    </div>

    <!-- Audio -->
    <audio id="audio">

        <source
            src="sonido.mp3"
            type="audio/mpeg">

    </audio>

    <script src="script.js"></script>

</body>

</html>
